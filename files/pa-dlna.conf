# pa-dlna user configuration.
# Selection order for stream encoders, lossless first.
#
# L16Encoder is first: it streams raw big-endian 16-bit PCM, announced as
# 'audio/L16;rate=44100;channels=2' (RFC 2586 / DLNA LPCM). This is what
# Kodi's DMR requires: its demuxer force-selects the 's16be' decoder for the
# audio/L16 content type, so the stream must be exactly raw big-endian PCM.
# The container-less L16Encoder matches that; the WAV-container variant
# (FFMpegL16WavEncoder, little-endian payload) is byte-swapped into noise by
# the same forced demuxer, and FLAC made Kodi's player abort mid-track.
# LPCM is equally lossless/bit-perfect and cheap on a LAN (~1.4 Mbps).
# Renderers whose DSP prefers FLAC still get it when their protocol info does
# not accept audio/L16; to prefer FLAC globally move FFMpegFlacEncoder above
# L16Encoder (Kodi will flap again, see fix #18 in the README).
[DEFAULT]
selection =
	L16Encoder,
	FFMpegFlacEncoder,
	FFMpegAiffEncoder,
	FFMpegL16WavEncoder,
	FFMpegOpusEncoder,
	FFMpegVorbisEncoder,
	FFMpegAacEncoder,
	FFMpegMp3Encoder

# The DR70 sink, monitor and stream all run at the PipeWire graph rate
# (44.1 kHz, set by ../pipewire/pipewire.conf.d/40-bitperfect-44100.conf),
# so CD-rate sources pass through natively and the DAC displays 44.1 kHz.
# On a machine whose graph runs at another rate, set 'rate' to match it
# (check with: pactl list sinks).
[L16Encoder]
rate = 44100

[FFMpegFlacEncoder]
rate = 44100

[FFMpegAiffEncoder]
rate = 44100

[FFMpegL16WavEncoder]
rate = 44100
