# pa-dlna user configuration.
# Selection order for stream encoders, lossless first.
#
# FLAC first: it is the DR70's long-verified format and, with the interop
# fixes in patches/ (see fix #18 in the README), it also plays reliably on
# the Kodi DMR -- ffmpeg resyncs on FLAC frame sync even when a renderer
# starts reading mid-stream. Do not pick the L16 encoders for Kodi: its raw
# s16be demuxer decodes stereo as mono (half speed), and the AIFF/WAV
# containers fail its probe (its input layer consumes a prefix of the stream
# before the demuxer opens, leaving no container signature to detect).
[DEFAULT]
selection =
	FFMpegFlacEncoder,
	FFMpegAiffEncoder,
	L16Encoder,
	FFMpegL16WavEncoder,
	FFMpegOpusEncoder,
	FFMpegVorbisEncoder,
	FFMpegAacEncoder,
	FFMpegMp3Encoder

# The DR70 sink, monitor and stream all run at the PipeWire graph rate
# (44.1 kHz, set by ../pipewire/pipewire.conf.d/40-bitperfect-44100.conf),
# so CD-rate sources pass through natively and the DAC displays 44.1 kHz.
# On a machine whose graph runs at another rate, set 'rate' to match it
# (check with: pactl list sinks).
[FFMpegFlacEncoder]
rate = 44100

[FFMpegAiffEncoder]
rate = 44100

[L16Encoder]
rate = 44100

[FFMpegL16WavEncoder]
rate = 44100
