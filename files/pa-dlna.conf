# pa-dlna user configuration.
# Selection order for stream encoders, lossless first. LPCM (L16) is first:
# Kodi 22.0-BETA1 stops live FLAC streams after ~10-40 s (its streaming-FLAC
# handling is broken: valid streams die mid-track, LPCM plays indefinitely),
# and L16 is equally lossless/bit-perfect, mandatory in DLNA and cheap on a
# LAN (~1.4 Mbps, no compression). FLAC is kept second for renderers whose
# DSP prefers it (e.g. a fine-tuned DR70): trade the selection order back.
[DEFAULT]
selection =
	FFMpegL16WavEncoder,
	FFMpegFlacEncoder,
	FFMpegAiffEncoder,
	FFMpegOpusEncoder,
	FFMpegVorbisEncoder,
	FFMpegAacEncoder,
	FFMpegMp3Encoder

# The DR70 sink, monitor and stream all run at the PipeWire graph rate
# (44.1 kHz, set by ../pipewire/pipewire.conf.d/40-bitperfect-44100.conf),
# so CD-rate sources pass through natively and the DAC displays 44.1 kHz.
# On a machine whose graph runs at another rate, set 'rate' to match it
# (check with: pactl list sinks).
[FFMpegFlacEncoder]
rate = 44100

[FFMpegAiffEncoder]
rate = 44100

[FFMpegL16WavEncoder]
rate = 44100