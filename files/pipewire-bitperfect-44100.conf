# Bit-perfect audio routing for the CelMusper DR70 (CelCast) DLNA renderer.
#
# The DR70 is fed from the PulseAudio null-sink monitor created by pa-dlna.
# By default PipeWire runs the whole audio graph at 48 kHz, so CD-rate
# (44.1 kHz) sources are resampled to 48 kHz before pa-dlna captures them,
# and the DAC displays 48 kHz regardless of what is playing.
#
# Running the graph clock at 44.1 kHz makes 44.1 kHz content pass through
# without resampling end-to-end (source -> graph -> null-sink -> monitor ->
# parec -> FLAC -> DAC), so the DAC displays the true source rate.
#
# Trade-off: any 48 kHz source (e.g. some internet radio) is down-mixed to
# 44.1 kHz by the graph. For this machine that is acceptable: the primary
# content is CD-rate lossless audio.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 ]
}